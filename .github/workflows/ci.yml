name: CI

on:
  push:
    branches: [ main ]
    paths:
      - '**'
      - '!**/*.md'
      - '!**/*.mdx'
      - '!docs/**'
      # Published Markdown and copied assets still need validation.
      - 'src/**'
      - 'public/**'
  pull_request:
    branches: [ main ]
    paths:
      - '**'
      - '!**/*.md'
      - '!**/*.mdx'
      - '!docs/**'
      - 'src/**'
      - 'public/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4
        with:
          path: site
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
        working-directory: ./site
      - run: bun run ci
        working-directory: ./site
