:root { --terminal-background: #303446; --terminal-foreground: #c6d0f5; --terminal-controls-color: #b5bfe2; --terminal-focus-color: #8caaee; --terminal-selection-background: #626880; }
html, body { margin: 0; background: transparent; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
#frame { width: 664px; flex: none; color: #c6d0f5; }
#term { width: 664px; height: 192px; cursor: text; outline: none; }
#term svg { display: block; width: 664px; height: 192px; max-width: none; user-select: text; }
#controls { display: flex; gap: 12px; align-items: center; margin-top: 12px; font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color: #c6d0f5; }
#controls button { background: transparent; color: inherit; border: 1px solid currentColor; border-radius: 6px; min-width: 54px; height: 26px; cursor: pointer; }
#play svg { display: none; width: 18px; height: 18px; margin: auto; pointer-events: none; }
#play[data-state="play"] .icon-play, #play[data-state="pause"] .icon-pause, #play[data-state="replay"] .icon-replay { display: block; }
#controls input[type=range] { flex: 1; min-width: 0; accent-color: #f2d5cf; }
#time { font-variant-numeric: tabular-nums; white-space: nowrap; }
#controls label { display: flex; gap: 4px; align-items: center; }
</style>
